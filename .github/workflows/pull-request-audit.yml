on:
  pull_request:
    branches:
      - main

name: Pull Request Audit

jobs:
  build-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-2022]
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4

      - name: Create Build Directory
        working-directory: core
        shell: bash
        run: cmake -E make_directory build

      - name: Configure CMake
        working-directory: core/build
        shell: bash
        run: cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: core/build
        shell: bash
        run: cmake --build . --target odas2

      - name: Ls build
        working-directory: core/build
        shell: bash
        run: ls -la

      - name: Ls lib
        working-directory: core/lib
        shell: bash
        run: ls -la

      - name: Ls lib/Debug
        working-directory: core/lib/Debug
        shell: bash
        run: ls -la

      - name: Tests
        working-directory: core/bin
        shell: bash
        run: ./tests
